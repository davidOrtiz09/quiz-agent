# Optional, self-hosted Langfuse (v2) for local observability + prompt management.
# Run with: docker compose -f docker-compose.langfuse.yml up -d
#
# Langfuse needs its own datastore (Postgres) — it cannot share the app's SQLite file.
#
# The LANGFUSE_INIT_* vars below headlessly provision everything on first boot — user,
# org, project, and API keys — so no signup clicking is needed. Put the same keys into
# .env (LANGFUSE_BASEURL=http://localhost:3001 + the pk/sk below), restart the app, and
# run `npm run seed:langfuse-prompts`. UI login: demo@quiz-agent.local / QuizAgent-Demo-2026.
# All values here are local-demo-only; replace for anything beyond localhost.
#
# Switching to Langfuse Cloud instead is a pure env change — no code or app-compose change.

services:
  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      # Demo-only secrets — replace with generated values for anything beyond local use.
      NEXTAUTH_SECRET: local-dev-nextauth-secret-change-me
      SALT: local-dev-salt-change-me
      TELEMETRY_ENABLED: "false"
      # Headless provisioning (runs once on a fresh database; skipped if the org exists).
      LANGFUSE_INIT_ORG_ID: quiz-agent-org
      LANGFUSE_INIT_ORG_NAME: Quiz Agent
      LANGFUSE_INIT_PROJECT_ID: quiz-agent-project
      LANGFUSE_INIT_PROJECT_NAME: quiz-agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-quiz-agent-local-demo
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-quiz-agent-local-demo
      LANGFUSE_INIT_USER_EMAIL: demo@quiz-agent.local
      LANGFUSE_INIT_USER_NAME: Demo
      LANGFUSE_INIT_USER_PASSWORD: QuizAgent-Demo-2026

volumes:
  langfuse-db-data:

# Everything runs through Docker — no Node/npm needed on the host.
#
#   docker compose up --build                  # production app on http://localhost:3000
#   docker compose --profile dev up dev        # dev server with hot reload (source bind-mounted)
#   docker compose run --rm test               # unit tests (vitest)
#   docker compose run --rm e2e                # E2E tests (Playwright, real LLM — needs GROQ_API_KEY)
#
# GROQ_API_KEY / LANGFUSE_* are interpolated from your shell or the .env file next to this file.

services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/app/data/dev.db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Point these at Langfuse Cloud or the optional docker-compose.langfuse.yml stack.
      # Leave blank to run with tracing/prompt-fetch disabled (in-code fallbacks are used).
      LANGFUSE_BASEURL: ${LANGFUSE_BASEURL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - quiz-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Hot-reload development: your working tree is bind-mounted; node_modules and .next stay
  # in container-local volumes. After changing package.json, rebuild:
  #   docker compose --profile dev build dev && docker compose --profile dev up --force-recreate dev
  dev:
    # Also in the "e2e" profile: the e2e-ui service runs the tests against this container
    # (one app container + one lean test container beats one giant container the VM OOM-kills).
    profiles: ["dev", "e2e"]
    build:
      context: .
      target: dev
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:./prisma/dev.db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      LANGFUSE_BASEURL: ${LANGFUSE_BASEURL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  # Unit tests (vitest) — pure domain/application logic, no LLM/DB/network needed.
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command: npm test
    volumes:
      - .:/app
      - /app/node_modules

  # E2E (Playwright) against the real Groq LLM. Source is baked into the image, and the
  # Playwright webServer boots the dev server inside this same container.
  e2e:
    profiles: ["e2e-headless"]
    build:
      context: .
      target: e2e
    shm_size: "1gb" # Chromium needs more than Docker's 64MB /dev/shm default
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

  # Watchable E2E: serves Playwright's UI mode over HTTP instead of running headless-and-silent.
  #   docker compose --profile e2e up e2e-ui
  # then open http://localhost:8080, press play, and watch the tests drive the app live
  # (screencast + time-travel through every step). The app under test runs in the separate
  # `dev` container — keeping this one lean so the VM doesn't OOM-kill it mid-run.
  e2e-ui:
    profiles: ["e2e"]
    build:
      context: .
      target: e2e
    depends_on:
      - dev
    shm_size: "1gb"
    command: npx playwright test --ui-host=0.0.0.0 --ui-port=8080
    ports:
      - "8080:8080"
    environment:
      PLAYWRIGHT_BASE_URL: http://dev:3000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}

volumes:
  quiz-data:
